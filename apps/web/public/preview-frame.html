<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Phone preview of the dashboard (components/Preview.js renders the page in here).
     A real page instead of srcdoc: some browsers apply their dark mode to srcdoc
     frames even when they ask for light, but respect it on normal pages. -->
<meta name="color-scheme" content="only light">
<meta name="darkreader-lock">
<meta name="robots" content="noindex">
<title>Preview</title>
<style>html{color-scheme:only light;scrollbar-width:none}html,body{margin:0;height:100%}body{overflow-y:auto;scrollbar-width:none}body::-webkit-scrollbar{display:none}#root{min-height:100%}</style>
</head>
<body><div id="root"></div></body>
</html>
